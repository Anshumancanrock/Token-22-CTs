[workspace]
resolver = "2"
members = ["remit", "programs/remit-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
bytemuck = "1.25"
num-traits = "0.2"
litesvm = "0.16.0"
solana-account-info = "3.1.1"
solana-address = "2.6.1"
solana-clock = "3.1.1"
solana-compute-budget-interface = "3.0.0"
solana-cpi = "3.1.0"
solana-instruction = "3.4.1"
solana-keypair = "3.1.2"
solana-message = { version = "4.4.1", features = ["wincode"] }
solana-msg = "3.1.0"
solana-program-entrypoint = "3.1.1"
solana-program-error = "3.0.1"
solana-program-pack = "3.1.0"
solana-signature = "3.4.1"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-sysvar = "4.1.0"
solana-transaction = { version = "4.1.6", features = ["wincode"] }
solana-transaction-error = "3.3.2"
solana-zk-elgamal-proof-interface = "0.1.3"
solana-zk-sdk = "7.0.1"
solana-zk-sdk-pod = "0.1.2"
spl-associated-token-account-interface = "2.0.0"
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }
spl-token-2022-interface = "3.1.1"
spl-token-confidential-transfer-proof-extraction = "0.6.1"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-metadata-interface = "1.0.1"
spl-type-length-value = "0.9.1"
thiserror = "2"

# Proof generation and the in-process ZK verifier are curve25519-heavy. Optimising
# dependencies keeps the confidential-transfer tests fast while our own crates stay
# in debug mode (full overflow checks, readable backtraces).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
